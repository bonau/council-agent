[project]
name = "council-agent"
version = "0.9.2"
description = "OpenRouter + CrewAI three-phase CLI framework (planning, execution, verification)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.108.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]

[project.scripts]
council = "council_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/council_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
