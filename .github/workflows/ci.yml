name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pytest
        env:
          OPENROUTER_API_KEY: test-key-for-ci
        run: uv run pytest

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate OpenSpec changes
        run: npx @fission-ai/openspec@latest validate --changes --strict

      - name: Validate OpenSpec specs
        run: npx @fission-ai/openspec@latest validate --specs --strict
