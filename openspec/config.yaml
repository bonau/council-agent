schema: spec-driven

context: |
  Project: Council Agent — OpenRouter + CrewAI 三階段 CLI 框架
  Tech stack: Python 3.11+, uv, CrewAI, Typer, Pydantic, pytest
  Architecture: Planning → Execution → Verification → Escalation pipeline
  Branching: git-flow (main / develop / feature/* / release/*)
  Commits: conventional commits (feat, fix, docs, chore, test, refactor)
  Testing: uv run pytest
  Docs: README.md, ROADMAP.md, CONTRIBUTING.md, AGENTS.md
  Development policy: Spec-driven Development with OpenSpec (see AGENTS.md)
  Current version: v1.0.0-alpha.1 — Trust Tier 0/1/2 runtime (`--trust-tier`); matrix-v2; exact grant consumption on product path
  Capabilities: tools (filesystem, shell, run_tests, CrewAI wrappers, policy gates on run_command), sandbox (WorkspaceGuard with policy denied_paths union, session, CLI, audit dir), orchestration (tracker, max_tool_calls, auto summaries, confirmation policy, audit logger install, project policy install), security (command classifier, interactive confirmation modes ask/auto/refuse/compat, structured audit JSONL + council audit show/export, council.policy.yaml allow/deny commands and denied_paths)

rules:
  proposal:
    - proposal.md MUST include a "Non-goals" section aligned with ROADMAP.md for the target milestone
    - Capabilities MUST map to existing or new openspec/specs/<name>/ directories
  tasks:
    - Multi-layer changes MUST follow progressive integration order (pure functions → wiring → framework → e2e)
    - Each task section MUST be independently verifiable with uv run pytest before moving to the next
    - Verification section MUST list pytest and both openspec validate commands (--changes and --specs)
