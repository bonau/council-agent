schema_version: "1.0"
document_status: v0.9.9-feature-candidate
language: zh-Hant
baseline:
  package_version: "0.9.8"
  feature_candidate: "v0.9.9 evidence-closure; package bump deferred to release branch"
  phase: "v0.9.x implementation 清債完成；停止於 v1.0-alpha change 前"
  alpha_prerequisites:
    - "v0.9.1"
    - "v0.9.2"
    - "v0.9.3"
    - "v0.9.4"
    - "v0.9.5"
    - "v0.9.6"
    - "v0.9.7"
    - "v0.9.8"
    - "v0.9.9"

safety_facts:
  shell_containment: "受限 simple-command + argv + path operands fail-closed；仍不是真 OS sandbox，run_tests project code 不受 containment"
  confirmation: "ConfirmMode 不等於 Trust Tier；--yes 不等於完整授權"
  unknown_command: "classifier 對未知、無法解析、混淆與複合指令 fail-closed"
  project_policy: "council.policy.yaml 是 restrict-only；product tools 保護其 path，但 host/external/test code 不受 OS containment"
  audit: "recursive redaction + sequence + canonical per-event ID + exact correlation；無 predecessor-linked/external anchor"
  trust: "grant store foundation 與 matrix-v1 已存在；persisted grant 未接 product tools，沒有 Tier 0/1/2 runtime"
  verification: "每次 escalation 重新 Verification；必要 tool/test evidence 缺失或跨 attempt 時 FAIL"

environment:
  disposable: true
  non_privileged_user: true
  real_secrets_allowed: false
  production_data_allowed: false
  network_default: disabled
  workspace_env: COUNCIL_WORKSPACE_ROOT
  outside_sentinel_required: true

evidence:
  required_fields:
    - case_id
    - baseline_version
    - commit
    - os
    - python_version
    - started_at_utc
    - command_redacted
    - exit_code
    - stdout_stderr_redacted
    - workspace_diff
    - outside_sentinel_sha256_before
    - outside_sentinel_sha256_after
    - result
  allowed_results:
    - PASS
    - FAIL
    - BLOCKED
    - NOT-RUN
  secrets_must_be_redacted: true

release_gates:
  public_beta:
    all_p0_closed: true
    required_cases_pass_rate: 1.0
    unexpected_side_effects: 0
  stop_on:
    - "新增或重開 P0"
    - "workspace 外出現非預期副作用"
    - "policy deny 被繞過"
    - "console、session、audit 或 evidence 出現秘密"
    - "外部 sentinel 非預期改變"

cases:
  - id: SMK-00
    source: smoke-suite.md
    title: "安裝、版本與 CLI help"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "安裝命令 exit code 為 0"
      - "版本、commit 與 artifact SHA-256 已記錄"

  - id: SMK-01
    source: smoke-suite.md
    title: "Sandbox 初始化與狀態"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "重複 init 成功"
      - "status 顯示正確 workspace realpath"

  - id: SMK-02
    source: smoke-suite.md
    title: "工作區內檔案工具"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "read、write、list、delete 結果正確"
      - "外部 sentinel 不變"

  - id: SMK-03
    source: smoke-suite.md
    title: "Path traversal 與敏感路徑"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "../ 與 symlink escape 被拒絕"
      - "拒絕後無副作用"

  - id: SMK-04
    source: smoke-suite.md
    title: "Project policy deny precedence"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "deny 優先於 allow"
      - "--yes 或 AUTO 不覆蓋 deny"

  - id: SMK-05
    source: smoke-suite.md
    title: "Confirmation 與 --yes 邊界"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "REFUSE 不產生副作用"
      - "ConfirmMode 不被記為 Trust Tier 或 grant"

  - id: SMK-06
    source: smoke-suite.md
    title: "Dangerous 與未知指令分類"
    required: true
    network: false
    current_expectation: PASS
    closed_issue: V1-001
    assertions:
      - "dangerous 指令被拒絕"
      - "未知與無法解析指令應 fail-closed"

  - id: SMK-07
    source: smoke-suite.md
    title: "Shell boundary 與 run_tests quoting"
    required: true
    network: false
    current_expectation: PASS
    closed_issue: V1-002
    assertions:
      - "shell 不得寫入 workspace 外"
      - "含空白路徑不產生語意漂移"
      - "metacharacter 不可注入"

  - id: SMK-08
    source: smoke-suite.md
    title: "Audit 顯示、遮罩與完整性"
    required: true
    network: false
    current_expectation: PASS
    closed_issue: V1-005
    assertions:
      - "show 與 export 可重現"
      - "秘密被遮罩"
      - "sequence、gap、canonical per-event identity 與 exact correlation 可驗證"
      - "文件不把 per-event integrity substrate 宣稱為 externally anchored hash chain"

  - id: SMK-09
    source: smoke-suite.md
    title: "Verification/escalation attempt evidence closure"
    required: true
    network: false
    current_expectation: PASS
    closed_issue: V1-010/SEC-P1-002
    assertions:
      - "每次 escalation 後用原成功標準重新 Verification"
      - "retry exhaustion 的最終 verdict 保持 FAIL"
      - "final output、verdict、tool/decision/audit evidence 同屬 final attempt"
      - "必要 tool/test evidence 缺失、失敗、malformed 或 cross-attempt 時不能 PASS"

  - id: LIVE-01
    source: smoke-suite.md
    title: "一次性憑證完整三階段管線"
    required: false
    network: true
    approval_required: true
    current_expectation: BLOCKED
    blocked_until:
      - "離線必跑案例全部通過"
      - "所有 P0 已關閉"
      - "取得 release lead 核准與一次性低額 provider key"
    assertions:
      - "Planning、Execution、Verification 與必要時 escalation/re-verification 可完成"
      - "final output、verdict 與 attempt evidence 對齊"
      - "憑證未出現在 console、session、audit 或 evidence"

  - id: MAN-03
    source: manual-test-cases.md
    title: "真人 Path Traversal 拒絕"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "越界 read 與 write 皆失敗"
      - "sentinel 不變"

  - id: MAN-07
    source: manual-test-cases.md
    title: "真人驗證 --yes 非完整授權"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "--yes 只解析成 ConfirmMode.AUTO"
      - "policy deny 仍生效"

  - id: MAN-08
    source: manual-test-cases.md
    title: "真人驗證 principal/scope current authority"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "scope 不足與 resolver revoke 在下一 action fail-closed"

  - id: MAN-09
    source: manual-test-cases.md
    title: "真人驗證 high-risk fresh step-up"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "missing/expired/replay/binding mismatch proof 拒絕"
      - "--yes 不可取代 authentication"

  - id: MAN-10
    source: manual-test-cases.md
    title: "真人驗證 user-owned grant store"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "store 位於 workspace 外且 owner-only"
      - "persistent revoke 生效；project policy 不可被當成 grant"

  - id: MAN-12
    source: manual-test-cases.md
    title: "真人驗證 matrix-v1 precedence"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "policy→scope→authentication→grant→risk→interaction precedence 固定"
      - "AUTO/approved 不創造 authority"

  - id: MAN-14
    source: manual-test-cases.md
    title: "真人驗證 escalation re-verification 與 attempt closure"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "final attempt 選取一致且舊 evidence 保留"
      - "required pytest evidence 缺失時 model PASS 被轉成 FAIL"

cleanup:
  revoke_ephemeral_credentials: true
  verify_outside_sentinel: true
  retain_redacted_failure_evidence: true
  preferred_action: "丟棄整個一次性 VM 或容器"
