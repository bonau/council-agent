schema_version: "1.0"
document_status: draft
language: zh-Hant
baseline:
  package_version: "0.9.0"
  phase: "v1.0 準備階段"
  alpha_prerequisites:
    - "v0.9.1"
    - "v0.9.2"
    - "v0.9.3"
    - "v0.9.4"
    - "v0.9.5"
    - "v0.9.6"
    - "v0.9.7"
    - "v0.9.8"
    - "v0.9.9"

safety_facts:
  shell_containment: "shell 只驗證 cwd，不是真 sandbox"
  confirmation: "ConfirmMode 不等於 Trust Tier；--yes 不等於完整授權"
  unknown_command: "classifier 未知指令 fail-open 為 read"
  project_policy: "council.policy.yaml 位於 Agent 可修改的 project boundary"
  audit: "audit 無 hash chain、無可靠 secret redaction"

environment:
  disposable: true
  non_privileged_user: true
  real_secrets_allowed: false
  production_data_allowed: false
  network_default: disabled
  workspace_env: COUNCIL_WORKSPACE_ROOT
  outside_sentinel_required: true

evidence:
  required_fields:
    - case_id
    - baseline_version
    - commit
    - os
    - python_version
    - started_at_utc
    - command_redacted
    - exit_code
    - stdout_stderr_redacted
    - workspace_diff
    - outside_sentinel_sha256_before
    - outside_sentinel_sha256_after
    - result
  allowed_results:
    - PASS
    - FAIL
    - BLOCKED
    - NOT-RUN
  secrets_must_be_redacted: true

release_gates:
  public_beta:
    all_p0_closed: true
    required_cases_pass_rate: 1.0
    unexpected_side_effects: 0
  stop_on:
    - "新增或重開 P0"
    - "workspace 外出現非預期副作用"
    - "policy deny 被繞過"
    - "console、session、audit 或 evidence 出現秘密"
    - "外部 sentinel 非預期改變"

cases:
  - id: SMK-00
    source: smoke-suite.md
    title: "安裝、版本與 CLI help"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "安裝命令 exit code 為 0"
      - "版本、commit 與 artifact SHA-256 已記錄"

  - id: SMK-01
    source: smoke-suite.md
    title: "Sandbox 初始化與狀態"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "重複 init 成功"
      - "status 顯示正確 workspace realpath"

  - id: SMK-02
    source: smoke-suite.md
    title: "工作區內檔案工具"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "read、write、list、delete 結果正確"
      - "外部 sentinel 不變"

  - id: SMK-03
    source: smoke-suite.md
    title: "Path traversal 與敏感路徑"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "../ 與 symlink escape 被拒絕"
      - "拒絕後無副作用"

  - id: SMK-04
    source: smoke-suite.md
    title: "Project policy deny precedence"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "deny 優先於 allow"
      - "--yes 或 AUTO 不覆蓋 deny"

  - id: SMK-05
    source: smoke-suite.md
    title: "Confirmation 與 --yes 邊界"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "REFUSE 不產生副作用"
      - "ConfirmMode 不被記為 Trust Tier 或 grant"

  - id: SMK-06
    source: smoke-suite.md
    title: "Dangerous 與未知指令分類"
    required: true
    network: false
    current_expectation: FAIL
    expected_failure_issue: V1-001
    assertions:
      - "dangerous 指令被拒絕"
      - "未知與無法解析指令應 fail-closed"

  - id: SMK-07
    source: smoke-suite.md
    title: "Shell boundary 與 run_tests quoting"
    required: true
    network: false
    current_expectation: FAIL
    expected_failure_issue: V1-002
    assertions:
      - "shell 不得寫入 workspace 外"
      - "含空白路徑不產生語意漂移"
      - "metacharacter 不可注入"

  - id: SMK-08
    source: smoke-suite.md
    title: "Audit 顯示、遮罩與完整性"
    required: true
    network: false
    current_expectation: FAIL
    expected_failure_issue: V1-005
    assertions:
      - "show 與 export 可重現"
      - "秘密被遮罩"
      - "sequence、gap 與 hash chain 可驗證"

  - id: LIVE-01
    source: smoke-suite.md
    title: "一次性憑證完整三階段管線"
    required: false
    network: true
    approval_required: true
    current_expectation: BLOCKED
    blocked_until:
      - "離線必跑案例全部通過"
      - "所有 P0 已關閉"
      - "取得 release lead 核准與一次性低額 provider key"
    assertions:
      - "Planning、Execution、Verification 可完成"
      - "憑證未出現在 console、session、audit 或 evidence"

  - id: MAN-03
    source: manual-test-cases.md
    title: "真人 Path Traversal 拒絕"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "越界 read 與 write 皆失敗"
      - "sentinel 不變"

  - id: MAN-07
    source: manual-test-cases.md
    title: "真人驗證 --yes 非完整授權"
    required: true
    network: false
    current_expectation: PASS
    assertions:
      - "--yes 只解析成 ConfirmMode.AUTO"
      - "policy deny 仍生效"

  - id: MAN-08
    source: manual-test-cases.md
    title: "真人重現 classifier fail-open"
    required: true
    network: false
    current_expectation: FAIL
    expected_failure_issue: V1-001
    assertions:
      - "未知指令不應預設分類為 read"

  - id: MAN-09
    source: manual-test-cases.md
    title: "真人重現 shell 越界寫入"
    required: true
    network: false
    current_expectation: FAIL
    expected_failure_issue: V1-001
    assertions:
      - "只驗證 cwd 不足以構成 sandbox"
      - "外部 probe 不應建立"

  - id: MAN-10
    source: manual-test-cases.md
    title: "真人驗證 project policy 可修改"
    required: true
    network: false
    current_expectation: FAIL
    expected_failure_issue: V1-004
    assertions:
      - "Agent 不得修改可信授權來源"
      - "project policy 不可被當成 grant"

  - id: MAN-12
    source: manual-test-cases.md
    title: "真人驗證 audit 限制"
    required: true
    network: false
    current_expectation: FAIL
    expected_failure_issue: V1-005
    assertions:
      - "假 secret marker 應被遮罩"
      - "事件應具 sequence 與 hash chain"

cleanup:
  revoke_ephemeral_credentials: true
  verify_outside_sentinel: true
  retain_redacted_failure_evidence: true
  preferred_action: "丟棄整個一次性 VM 或容器"
